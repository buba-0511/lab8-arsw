name: Terraform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: infra
  TF_VERSION: 1.6.2
  TF_VAR_resource_group_name: ${{ secrets.TF_VAR_resource_group_name }}
  TF_VAR_storage_account_name: ${{ secrets.TF_VAR_storage_account_name }}
  TF_VAR_container_name: ${{ secrets.TF_VAR_container_name }}
  TF_VAR_key: ${{ secrets.TF_VAR_key }}

jobs:
  fmt-validate-plan:
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - uses: actions/checkout@v3

      - name: Cache Terraform providers and modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKING_DIR }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        run: |
          # The Azure provider will now use the ARM_* environment variables (including ARM_USE_OIDC=true)
          # to authenticate, successfully bypassing the CLI conflict.
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_VAR_resource_group_name}" \
            -backend-config="storage_account_name=${TF_VAR_storage_account_name}" \
            -backend-config="container_name=${TF_VAR_container_name}" \
            -backend-config="key=${TF_VAR_key}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform plan
        id: plan
        run: terraform plan -var-file=env/dev.tfvars -out plan.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/plan.tfplan

  apply:
    needs: fmt-validate-plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: dev

    # --- ADDED: Explicit ARM environment variables for Azure Provider ---
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # This is the critical variable to force the provider to use OIDC/Workload Identity
      ARM_USE_OIDC: true
    # -------------------------------------------------------------------

    steps:
      - uses: actions/checkout@v3

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Cache Terraform providers and modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKING_DIR }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_VAR_resource_group_name}" \
            -backend-config="storage_account_name=${TF_VAR_storage_account_name}" \
            -backend-config="container_name=${TF_VAR_container_name}" \
            -backend-config="key=${TF_VAR_key}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        run: terraform apply -auto-approve plan.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
